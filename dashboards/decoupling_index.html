<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National "Decoupling" Index Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .dashboard-panel {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .loader {
            border: 5px solid #e5e7eb;
            border-radius: 50%;
            border-top: 5px solid #3b82f6;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .table-row-hover:hover {
            background-color: #eff6ff;
            cursor: pointer;
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="container mx-auto p-4 md:p-6">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-gray-900">National "Decoupling" Index</h1>
            <p class="text-gray-600 mt-2">Ranking countries by their ability to grow their economy without increasing emissions.</p>
        </div>

        <!-- Loading Indicator -->
        <div id="loader-container" class="flex flex-col items-center justify-center h-screen">
            <div class="loader"></div>
            <p class="mt-4 text-lg text-gray-600">Loading and analyzing global data...</p>
        </div>

        <!-- Main Dashboard Content -->
        <div id="dashboard-content" class="hidden">
            <!-- Controls -->
            <div class="dashboard-panel mb-6">
                <label for="year-slider" class="block text-sm font-medium text-gray-700 mb-2">Select Decade for Analysis: <span id="year-label" class="font-bold">2012 - 2022</span></label>
                <input type="range" id="year-slider" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Main Visualization Row -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="dashboard-panel">
                    <h2 class="text-xl font-semibold mb-4 text-center">Country Rankings</h2>
                    <div class="overflow-y-auto h-96">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rank</th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Country</th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Decoupling Score</th>
                                </tr>
                            </thead>
                            <tbody id="ranking-table" class="bg-white divide-y divide-gray-200">
                                <!-- Rows will be populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="dashboard-panel">
                    <h2 id="chart-title" class="text-xl font-semibold mb-4 text-center">Decoupling Trend</h2>
                    <canvas id="decoupling-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // DOM Elements
            const loader = document.getElementById('loader-container');
            const dashboard = document.getElementById('dashboard-content');
            const yearSlider = document.getElementById('year-slider');
            const yearLabel = document.getElementById('year-label');
            const rankingTable = document.getElementById('ranking-table');
            const chartTitle = document.getElementById('chart-title');
            const decouplingChartCanvas = document.getElementById('decoupling-chart');

            let allData = [];
            let decouplingChart;

            // --- Data Loading ---
            async function loadData() {
                try {
                    const url = 'https://raw.githubusercontent.com/owid/co2-data/master/owid-co2-data.csv';
                    const response = await fetch(url);
                    const csvText = await response.text();
                    const lines = csvText.trim().split('\n');
                    const headers = lines[0].split(',');
                    
                    const requiredIndices = {
                        country: headers.indexOf('country'),
                        year: headers.indexOf('year'),
                        gdp: headers.indexOf('gdp'),
                        total_ghg: headers.indexOf('total_ghg')
                    };

                    const nonCountryEntities = new Set(['World', 'Asia', 'Oceania', 'Europe', 'Africa', 'North America', 'South America', 'High-income countries', 'Low-income countries', 'Lower-middle-income countries', 'Upper-middle-income countries', 'European Union (27)', 'European Union (28)']);

                    allData = lines.slice(1).map(line => {
                        const values = line.split(',');
                        const country = values[requiredIndices.country];
                        if (!country || nonCountryEntities.has(country)) return null;
                        
                        const row = {};
                        for (const [key, index] of Object.entries(requiredIndices)) {
                            row[key] = parseFloat(values[index]);
                        }
                        row.country = country;
                        return row;
                    }).filter(d => d && !isNaN(d.gdp) && !isNaN(d.total_ghg));

                    const years = [...new Set(allData.map(d => d.year))].sort();
                    yearSlider.min = years[0];
                    yearSlider.max = years[years.length - 1] - 10; // Ensure a 10-year range
                    yearSlider.value = yearSlider.max;
                    
                    loader.style.display = 'none';
                    dashboard.classList.remove('hidden');

                    updateDashboard();
                } catch (error) {
                    loader.innerHTML = '<p class="text-red-500 font-semibold">Failed to load data.</p>';
                    console.error("Data loading failed:", error);
                }
            }

            // --- Core Logic ---
            function calculateDecouplingIndex(startYear, endYear) {
                const countries = [...new Set(allData.map(d => d.country))];
                const results = [];

                countries.forEach(country => {
                    const countryData = allData.filter(d => d.country === country && d.year >= startYear && d.year <= endYear).sort((a,b) => a.year - b.year);
                    if (countryData.length < 10) return; // Need enough data for a stable calculation

                    let gdpChanges = [];
                    let ghgChanges = [];

                    for (let i = 1; i < countryData.length; i++) {
                        const prev = countryData[i-1];
                        const curr = countryData[i];

                        if (prev.gdp > 0) gdpChanges.push((curr.gdp - prev.gdp) / prev.gdp);
                        if (prev.total_ghg > 0) ghgChanges.push((curr.total_ghg - prev.total_ghg) / prev.total_ghg);
                    }

                    if (gdpChanges.length === 0 || ghgChanges.length === 0) return;

                    const avgGdpGrowth = gdpChanges.reduce((a, b) => a + b, 0) / gdpChanges.length;
                    const avgGhgGrowth = ghgChanges.reduce((a, b) => a + b, 0) / ghgChanges.length;

                    // Decoupling Score = Difference in average annual growth rates
                    const score = (avgGdpGrowth - avgGhgGrowth) * 100; // As a percentage
                    
                    results.push({ country, score });
                });

                return results.sort((a, b) => b.score - a.score);
            }

            function updateDashboard() {
                const startYear = parseInt(yearSlider.value);
                const endYear = startYear + 10;
                yearLabel.textContent = `${startYear} - ${endYear}`;

                const rankedData = calculateDecouplingIndex(startYear, endYear);
                
                updateTable(rankedData);
                
                if (rankedData.length > 0) {
                    updateChart(rankedData[0].country, startYear, endYear);
                }
            }

            function updateTable(data) {
                rankingTable.innerHTML = '';
                data.slice(0, 50).forEach((item, index) => { // Show top 50
                    const row = document.createElement('tr');
                    row.className = 'table-row-hover';
                    
                    const scoreColor = item.score > 0 ? 'text-green-600' : 'text-red-600';

                    row.innerHTML = `
                        <td class="px-4 py-2 whitespace-nowrap text-sm font-medium text-gray-900">${index + 1}</td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-700">${item.country}</td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm font-semibold ${scoreColor}">${item.score.toFixed(2)}</td>
                    `;
                    
                    row.addEventListener('click', () => {
                        const startYear = parseInt(yearSlider.value);
                        updateChart(item.country, startYear, startYear + 10);
                    });
                    rankingTable.appendChild(row);
                });
            }

            function updateChart(country, startYear, endYear) {
                chartTitle.textContent = `Decoupling Trend for ${country}`;
                const countryData = allData.filter(d => d.country === country && d.year >= startYear && d.year <= endYear).sort((a,b) => a.year - b.year);
                
                const labels = countryData.map(d => d.year);
                const gdpData = countryData.map(d => d.gdp);
                const ghgData = countryData.map(d => d.total_ghg);

                if (decouplingChart) decouplingChart.destroy();
                decouplingChart = new Chart(decouplingChartCanvas, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'GDP (USD)',
                            data: gdpData,
                            borderColor: 'rgba(59, 130, 246, 1)',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            yAxisID: 'y-gdp',
                            tension: 0.1
                        }, {
                            label: 'GHG (Million Tonnes)',
                            data: ghgData,
                            borderColor: 'rgba(239, 68, 68, 1)',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            yAxisID: 'y-ghg',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            'y-gdp': {
                                type: 'linear',
                                position: 'left',
                                title: { display: true, text: 'GDP (USD)' }
                            },
                            'y-ghg': {
                                type: 'linear',
                                position: 'right',
                                title: { display: true, text: 'GHG (Million Tonnes)' },
                                grid: { drawOnChartArea: false }
                            }
                        }
                    }
                });
            }

            // --- Event Listeners ---
            yearSlider.addEventListener('change', updateDashboard);
            yearSlider.addEventListener('input', () => {
                 const startYear = parseInt(yearSlider.value);
                 yearLabel.textContent = `${startYear} - ${startYear + 10}`;
            });
            
            // --- Initial Load ---
            await loadData();
        });
    </script>
</body>
</html>
